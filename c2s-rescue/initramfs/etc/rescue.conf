# c2s rescue initramfs configuration. Sourced by /init (busybox sh).

# Subnet shared by both gadget links (a /24 each, disjoint so routes stay
# unambiguous on dual-stack hosts):
#   NCM   (Linux, macOS):    192.168.42.1
#   RNDIS (Windows, others): 192.168.62.1
RESCUE_PREFIX="24"
RESCUE_NCM_ADDR="192.168.42.1"
RESCUE_RNDIS_ADDR="192.168.62.1"

# SSH (dropbear, public-key only) listen port.
RESCUE_SSH_PORT="22"

# Debug telnet (busybox telnetd, no authentication) port.
RESCUE_TELNET_PORT="23"
# Telnet only starts when BOTH conditions hold:
#   1. RESCUE_ENABLE_TELNET="1" here, and
#   2. the /etc/enable-telnet marker file exists (see rescue-telnet).
RESCUE_ENABLE_TELNET="0"

# Boot menu: evdev device for gpio-keys selection and how long the
# menu waits for a key press. Volume down selects telnet mode; the
# default (timeout, power, volume up) is SSH-only rescue.
RESCUE_MENU_DEV="/dev/input/event0"
RESCUE_MENU_TIMEOUT="5"
